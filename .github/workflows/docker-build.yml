# 手动触发：构建多架构镜像（amd64 / arm64），仅推送 latest 至 Docker Hub。
# Dockerfile 与构建上下文位于 .github/docker/ 目录。
# 镜像源码来自 https://github.com/julyyuu5256/dnsmgr 的 main.zip。
# Docker Hub 仓库为 julyyuu/dnsmgr（账号 julyyuu，与 GitHub 用户名不同）。
#
# 需在仓库 Settings → Secrets 中配置：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Docker Hub 访问令牌）

name: Docker Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub, latest only)
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,oci-mediatypes=false
          # 每次运行唯一，打破「下载源码 + composer」等层的缓存，否则会一直用首次构建时的层
          build-args: |
            CACHE_BUST=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 避免向仓库推送 attestations；部分镜像仓库无法解析导致 “fail to parse manifest.json”
          provenance: false
          sbom: false
          tags: |
            julyyuu/dnsmgr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
